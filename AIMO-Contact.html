<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>/* nav-menu */
(function(){
  function set(open){ var b=document.querySelector(".aimo-burger"), m=document.querySelector(".aimo-menu"); if(!b||!m)return; b.setAttribute("data-open",open?"1":"0"); m.setAttribute("data-open",open?"1":"0"); b.setAttribute("aria-label",open?"Close menu":"Open menu"); document.body.style.overflow=open?"hidden":""; }
  document.addEventListener("click",function(e){ var t=e.target; if(t.closest&&t.closest(".aimo-burger")){ e.preventDefault(); var o=document.querySelector(".aimo-burger").getAttribute("data-open")==="1"; set(!o); return; } if(t.closest&&t.closest(".aimo-menu a")){ set(false); } });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") set(false); });
  window.addEventListener("resize",function(){ if(window.innerWidth>860) set(false); });
})();
</script>
<script>/* mobile-grids */
(function(){
  function apply(){
    var m=window.matchMedia('(max-width:860px)').matches;
    document.querySelectorAll('[style*="grid-template-columns"]').forEach(function(el){
      if(el.dataset.gtc===undefined) el.dataset.gtc=el.style.gridTemplateColumns||'';
      var g=el.dataset.gtc; if(!g) return;
      var lenChild=el.children[2];
      if(!m){ el.style.gridTemplateColumns=g; if(el.dataset.hidLen==='1'&&lenChild){lenChild.style.display='';} return; }
      if(/^\s*52px\s+minmax/.test(g)){ el.style.gridTemplateColumns='40px minmax(0,1fr) auto'; if(lenChild){lenChild.style.display='none'; el.dataset.hidLen='1';} return; }
      if(/^\s*56px\s+minmax/.test(g) || /^\s*auto\s+minmax/.test(g)){ return; }
      if(/minmax\(\s*0,\s*180px\)/.test(g)){ el.style.gridTemplateColumns='106px minmax(0,1fr)'; return; }
      if(/repeat\(\s*[34]/.test(g)){ el.style.gridTemplateColumns='1fr 1fr'; return; }
      if(/repeat\(\s*2/.test(g) || /(300|360|380)px/.test(g) || /1\.05fr|1\.4fr|1\.1fr|\.9fr/.test(g) || /1fr\)\s*minmax\(\s*0,\s*1fr\)/.test(g)){ el.style.gridTemplateColumns='1fr'; return; }
    });
    document.querySelectorAll('[style*="sticky"]').forEach(function(el){ if(el.dataset.pos===undefined)el.dataset.pos=el.style.position; el.style.position=m?'static':(el.dataset.pos||'sticky'); });
  }
  document.addEventListener('DOMContentLoaded',apply);
  window.addEventListener('load',apply);
  window.addEventListener('resize',apply);
  var t=setInterval(apply,500); setTimeout(function(){clearInterval(t);},6000);
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; background: #050507; }
  body {
    margin: 0; color: #f2f1f5; font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55; overflow-x: hidden;
    background: radial-gradient(circle at 50% -10%, rgba(124,53,255,.23), transparent 28rem), linear-gradient(180deg, #07060b 0%, #050507 100%);
    background-attachment: fixed;
  }
  @keyframes aimo-scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
  @keyframes aimo-flicker { 0%,100%,92% { opacity: 1; } 93% { opacity: .35; } 94% { opacity: 1; } 96% { opacity: .6; } 97% { opacity: 1; } }
  @keyframes aimo-blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes aimo-rgb { 0%,100%{transform:translateX(0);} 40%{transform:translateX(-3px);} 60%{transform:translateX(2px);} }
  @keyframes aimo-slice { 0%,86%,100%{opacity:0;top:0;transform:translateX(0);} 87%{opacity:.85;top:24%;transform:translateX(-16px);} 89%{opacity:.5;top:63%;transform:translateX(12px);} 91%{opacity:.9;top:44%;transform:translateX(-7px);} 93%{opacity:0;} }
  @keyframes aimo-glitchpulse { 0%,45%,52%,100%{text-shadow:0 0 34px rgba(124,53,255,.3);transform:translateX(0);} 47%{text-shadow:3px 0 rgba(211,76,255,.9),-3px 0 rgba(0,225,255,.75),0 0 34px rgba(124,53,255,.4);transform:translateX(1px);} 49%{text-shadow:-3px 0 rgba(211,76,255,.9),3px 0 rgba(0,225,255,.75),0 0 34px rgba(124,53,255,.4);transform:translateX(-1px);} }
  @keyframes aimo-hoverglitch { 0%{transform:translate(0,0);filter:none;text-shadow:none;} 15%{transform:translate(-2px,1px);filter:hue-rotate(-20deg) saturate(1.5);text-shadow:2px 0 rgba(211,76,255,.9),-2px 0 rgba(0,225,255,.7);} 30%{transform:translate(2px,-1px);filter:none;} 45%{transform:translate(-1px,-2px);filter:contrast(1.3) hue-rotate(18deg);text-shadow:-2px 0 rgba(211,76,255,.9),2px 0 rgba(0,225,255,.7);} 60%{transform:translate(2px,1px);filter:none;text-shadow:none;} 80%{transform:translate(-1px,1px);filter:saturate(1.4);} 100%{transform:translate(0,0);filter:none;} }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation: none !important; } html { scroll-behavior: auto; } }
  /* mq-mobile */
  @media (max-width: 900px){
    header nav a{ white-space:nowrap; }
    header nav{ gap:16px !important; }
  }
  @media (max-width: 640px){
    header > div{ height:66px !important; gap:8px !important; }
    header img[alt="AIMO"]{ height:40px !important; }
    header nav{ gap:12px !important; }
    header nav a{ font-size:.58rem !important; letter-spacing:.04em !important; white-space:nowrap; }
    [style*="grid-template-columns:repeat(2,minmax(0,1fr))"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:repeat(3,minmax(0,1fr))"]{ grid-template-columns:1fr 1fr !important; }
    [style*="grid-template-columns:repeat(4,minmax(0,1fr))"]{ grid-template-columns:1fr 1fr !important; }
    [style*="minmax(0,360px) minmax(0,1fr)"]{ grid-template-columns:1fr !important; }
    [style*="minmax(0,380px) minmax(0,1fr)"]{ grid-template-columns:1fr !important; }
    [style*="minmax(0,300px) minmax(0,1fr)"]{ grid-template-columns:1fr !important; }
    [style*="minmax(0,1fr) minmax(0,1.05fr)"]{ grid-template-columns:1fr !important; min-height:0 !important; }
    [style*="minmax(0,1.4fr) minmax(0,1fr)"]{ grid-template-columns:1fr !important; }
    [style*="minmax(0,1.1fr) minmax(0,.9fr)"]{ grid-template-columns:1fr !important; }
    [style*="minmax(0,1fr) minmax(0,1fr)"]{ grid-template-columns:1fr !important; }
    [style*="position:sticky; top:96px"]{ position:static !important; }
  }


  .aimo-burger{ display:none; position:absolute; right:14px; top:50%; transform:translateY(-50%); width:34px; height:34px; border:0; background:transparent; cursor:pointer; padding:0; z-index:2; }
  .aimo-burger .bx{ position:relative; display:block; width:21px; height:13px; margin:0 auto; }
  .aimo-burger .bx i{ position:absolute; left:0; right:0; height:2px; background:#f2f1f5; box-shadow:0 0 8px rgba(124,53,255,.85); transition:transform .25s ease, opacity .18s, top .25s ease, background .2s; }
  .aimo-burger .bx i:nth-child(1){ top:0; } .aimo-burger .bx i:nth-child(2){ top:5.5px; } .aimo-burger .bx i:nth-child(3){ top:11px; }
  .aimo-burger[data-open="1"] .bx i:nth-child(1){ top:5.5px; transform:rotate(45deg); background:#9d5cff; }
  .aimo-burger[data-open="1"] .bx i:nth-child(2){ opacity:0; }
  .aimo-burger[data-open="1"] .bx i:nth-child(3){ top:5.5px; transform:rotate(-45deg); background:#9d5cff; }
  .aimo-menu{ display:none; position:fixed; inset:0; z-index:150; background:rgba(5,5,7,.97); backdrop-filter:blur(10px); flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  .aimo-menu[data-open="1"]{ display:flex; }
  .aimo-menu img{ width:72px; height:auto; margin-bottom:14px; filter:drop-shadow(0 0 18px rgba(124,53,255,.6)); }
  .aimo-menu a{ font-family:Anton, sans-serif; text-transform:uppercase; font-size:2.1rem; letter-spacing:.02em; color:#f2f1f5; text-decoration:none; text-shadow:0 0 20px rgba(124,53,255,.3); }
  .aimo-menu a.on, .aimo-menu a:hover{ color:#9d5cff; }
  @media (max-width:860px){ [data-contact-grid]{ grid-template-columns:1fr !important; align-items:start !important; } [data-contact-img]{ min-height:0 !important; aspect-ratio:4/5; } }
  @media (max-width:860px){ .aimo-navgroup{ display:none !important; } .aimo-burger{ display:block !important; } header img[alt="AIMO"]{ height:46px !important; } }
</style>
</helmet>
<div style="position:relative; min-height:100vh; isolation:isolate; display:flex; flex-direction:column;">
  <div aria-hidden="true" style="position:fixed; inset:0; z-index:998; pointer-events:none;">
      <div style="position:absolute; inset:0; opacity:.16; mix-blend-mode:screen; background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.06) 1px, transparent 1px, transparent 3px);"></div>
      <div style="position:absolute; inset:0; mix-blend-mode:screen; opacity:.55; background:linear-gradient(90deg, rgba(211,76,255,.06), transparent 14%, transparent 86%, rgba(0,206,255,.06)); animation:aimo-rgb 2.6s steps(3,end) infinite;"></div>
      <div style="position:absolute; left:0; right:0; top:0; height:3px; background:rgba(179,120,255,.75); mix-blend-mode:screen; opacity:0; animation:aimo-slice 6.5s steps(1,end) infinite;"></div>
      <div style="position:absolute; left:0; right:0; top:0; height:200px; background:linear-gradient(180deg, rgba(157,92,255,.15), transparent); animation:aimo-scan 6s linear infinite;"></div>
      <div style="position:absolute; inset:0; background:rgba(124,53,255,.025); animation:aimo-flicker 5s infinite;"></div>
      <div style="position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, transparent 58%, rgba(3,2,6,.42));"></div>
    </div>

  <header style="position:fixed; top:0; left:0; right:0; z-index:300; border-bottom:1px solid rgba(157,92,255,.15); background:rgba(5,5,7,.62); backdrop-filter:blur(18px);">
    <div style="position:relative; width:min(1180px, calc(100% - 40px)); margin-inline:auto; height:78px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
      <a href="./index.html" style="display:inline-flex; align-items:center;" style-hover="animation:aimo-hoverglitch .32s steps(4,end) infinite;"><img src="./assets/aimo-face.png" alt="AIMO" style="height:56px; width:auto; display:block; filter:drop-shadow(0 0 16px rgba(124,53,255,.55));"></a>
      <nav class="aimo-navgroup" aria-label="Primary" style="display:flex; gap:28px; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:.74rem; text-transform:uppercase; letter-spacing:.14em;">
        <a href="./AIMO-Music.html" style="color:#c7c1d0; text-decoration:none;" style-hover="animation:aimo-hoverglitch .32s steps(4,end) infinite; color:#9d5cff;">Music</a>
        <a href="./AIMO-Videos.html" style="color:#c7c1d0; text-decoration:none;" style-hover="animation:aimo-hoverglitch .32s steps(4,end) infinite; color:#9d5cff;">Videos</a>
        <a href="./AIMO-Band.html" style="color:#c7c1d0; text-decoration:none;" style-hover="animation:aimo-hoverglitch .32s steps(4,end) infinite; color:#9d5cff;">Band</a>
        <a href="./AIMO-Contact.html" style="color:#9d5cff; text-decoration:none;" style-hover="animation:aimo-hoverglitch .32s steps(4,end) infinite; color:#c5a8ff;">Contact</a>
      </nav>
      <button class="aimo-burger" type="button" data-open="0" aria-label="Open menu"><span class="bx"><i></i><i></i><i></i></span></button>
    </div>
  </header>
  <div class="aimo-menu" data-open="0" aria-hidden="true">
    <img src="./assets/aimo-face.png" alt="">
    <a href="./index.html" class="aimo-mlink">Home</a>
    <a href="./AIMO-Music.html" class="aimo-mlink">Music</a>
    <a href="./AIMO-Videos.html" class="aimo-mlink">Videos</a>
    <a href="./AIMO-Band.html" class="aimo-mlink">Band</a>
    <a href="./AIMO-Contact.html" class="aimo-mlink on">Contact</a>
  </div>

  <section style="position:relative; flex:1; isolation:isolate; overflow:hidden; padding-top:130px; padding-bottom:clamp(60px,8vw,110px);">
    <div aria-hidden="true" style="position:absolute; inset:0; z-index:-1; background:url(./assets/circuit-tex.png) center/cover; opacity:.14; mix-blend-mode:screen;"></div>
    <div style="width:min(1180px, calc(100% - 40px)); margin-inline:auto;">
      <div style="font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.2em; color:#9d5cff; font-size:.78rem; animation:aimo-flicker 6s infinite;">// OPEN CHANNEL</div>
      <h1 style="margin:14px 0 34px; font-family:Anton,sans-serif; text-transform:uppercase; line-height:.86; letter-spacing:-.02em; font-size:clamp(3.2rem,11vw,8rem); text-shadow:0 0 34px rgba(124,53,255,.3); animation:aimo-glitchpulse 4.5s infinite;">Connect</h1>

      <div data-contact-grid style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(24px,4vw,48px); align-items:stretch;">
        <div style="display:grid; gap:14px; align-content:start;">
          <div style="font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:#9b96a6; text-transform:uppercase; letter-spacing:.12em;">// DIRECT LINKS</div>
          <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 20px; border:1px solid rgba(157,92,255,.26); background:#0d0b13; color:#f2f1f5; text-decoration:none; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em;" style-hover="animation:aimo-hoverglitch .32s steps(4,end) infinite; border-color:#9d5cff; color:#9d5cff;">
              <span style="font-size:.9rem;">{{ l.name }}</span>
              <span style="font-size:.7rem; color:#9b96a6;">{{ l.handle }}</span>
            </a>
          </sc-for>
        </div>
        <div data-contact-img style="position:relative; align-self:stretch; border:1px solid rgba(157,92,255,.26); box-shadow:0 26px 80px rgba(0,0,0,.55); overflow:hidden;">
          <img src="./assets/contact-band.jpg" alt="AIMO in the alley" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center;">
          <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; opacity:.13; mix-blend-mode:screen; background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0, rgba(255,255,255,.5) 1px, transparent 1px, transparent 3px);"></div>
        </div>
      </div>
    </div>
  </section>

  <footer style="border-top:1px solid rgba(157,92,255,.26); background:#07060b;">
    <div style="width:min(1180px, calc(100% - 40px)); margin-inline:auto; padding:20px 0; display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:center; color:#9b96a6; font-family:'IBM Plex Mono',monospace; font-size:.72rem; text-transform:uppercase; letter-spacing:.1em;">
      <span style="color:#9d5cff;">● SYS_OK</span>
      <span>AIMO // AI MUSIC. REAL EMOTIONS.</span>
      <span>© 2026 AIMO — ALL SIGNALS RESERVED</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      links: [
        { name: "YouTube", handle: "@aimotherobotband", href: "https://www.youtube.com/@aimotherobotband" },
        { name: "TikTok", handle: "@aimo.music", href: "https://www.tiktok.com/@aimo.music" },
        { name: "Instagram", handle: "@aimo_music", href: "https://www.instagram.com/aimo_music" },
        { name: "Email", handle: "aimotherobotband@gmail.com", href: "mailto:aimotherobotband@gmail.com" },
      ],
    };
  }
}
</script>
</body>
</html>
